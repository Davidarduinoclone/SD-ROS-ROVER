; Rover drivetrain firmware: ESP32 + micro-ROS (Humble) + FreeRTOS
;
; Build:   pio run
; Flash:   pio run -t upload
; The first build downloads and compiles micro-ROS, which takes several minutes.
; If you change board_microros_* options or extra_packages/, run `pio run -t clean_microros` first.
; extra_packages/ holds message packages micro-ROS doesn't ship (tf2_msgs for /tf).

[platformio]
default_envs = esp32dev

[env:esp32dev]
; espressif32 6.x = Arduino-ESP32 2.0.x (ESP-IDF 4.4), the core micro_ros_platformio supports
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

upload_speed = 921600
monitor_speed = 115200

; ---- micro-ROS ----
board_microros_distro = humble
; serial = USB cable to the Pi (agent_serial alias in the container)
; wifi   = UDP over Wi-Fi (agent_udp alias); also needs set_microros_wifi_transports() in main.cpp
board_microros_transport = serial

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio

build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -I src
    ; UART0 carries the micro-ROS stream, so keep the Arduino core's log output off it
    -DCORE_DEBUG_LEVEL=0
    ; rcl marks fini/publish results warn_unused_result; we ignore them on purpose
    -Wno-unused-result
