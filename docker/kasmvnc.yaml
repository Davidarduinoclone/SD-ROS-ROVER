desktop:
  resolution:
    width: 1024
    height: 768
  allow_resize: true
  pixel_depth: 24

network:
  protocol: http
  interface: 0.0.0.0
  websocket_port: 8444
  use_ipv4: true
  use_ipv6: true
  udp:
    public_ip: auto
    port: auto
    stun_server: auto
  ssl:
    pem_certificate: /etc/ssl/certs/ssl-cert-snakeoil.pem
    pem_key: /etc/ssl/private/ssl-cert-snakeoil.key
    require_ssl: false


security:
  brute_force_protection:
    blacklist_threshold: 0
    blacklist_timeout: 0

logging:
  log_writer_name: all
  log_dest: logfile
  level: 100  
